<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My App 5</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: #fff;
      text-align: center;
      padding: 80px 20px;
      margin: 0;
    }
    h1 { font-size: 3rem; margin-bottom: 10px; }
    p { font-size: 1.2rem; }
    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      background: #fff;
      color: #0077cc;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Hello from my-app5!</h1>
  <p>My first page deployed from GitHub.</p>
  <button onclick="document.getElementById('msg').textContent = 'It works! ' + new Date().toLocaleString()">
    Click me
  </button>
  <p id="msg"></p>
</body>
</html>
